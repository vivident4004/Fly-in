[project]
name = "fly-in"
version = "0.5.7.7"
description = "Drone routing simulation @ 42 school."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "flake8>=7.1",
    "ty>=0.0.58",
    "pytest>=9.1.1",
]

# Non trattare src/ come pacchetto installabile
[tool.uv]
package = false
cache-dir = "./.cache"

# rende importabile `src` (root del repo) quando si lancia `pytest`
# senza `-m` (uv run pytest non aggiunge la cwd a sys.path da solo)
[tool.pytest.ini_options]
pythonpath = ["."]

# regole equivalenti a flake8 (E/W = pycodestyle, F = pyflakes) + extra utili
[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
#select = ["E", "W", "F", "I", "B", "UP"]
# E,W = stile (come flake8) | F = errori logici (come flake8) | I = ordine import
# B = bug comuni (bugbear) | UP = sintassi moderna
select = ["ALL"]
ignore = ["S324", "PLR", "FBT", "TRY", "EM", "PLC"]
preview = true

[tool.ruff.lint.flake8-type-checking]
strict = true

# mypy
[tool.mypy]
#python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

# Strict rules equivalent to mypy --strict
[tool.ty.rules]
unresolved-reference = "error"
invalid-assignment = "error"
invalid-argument-type = "error"
invalid-return-type = "error"
missing-argument = "error"
unresolved-import = "error"

# Warnings for gradual adoption
possibly-unresolved-reference = "warn"

# Optional: Ignore specific noise if migrating
# possibly-missing-attribute = "ignore"
